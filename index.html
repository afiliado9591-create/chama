<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dridalia Moda & SocialChat</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="bg-gray-100 h-screen flex flex-col" x-data="app()">

    <!-- App Container Principal -->
    <div class="flex h-full w-full max-w-7xl mx-auto shadow-2xl bg-white overflow-hidden relative">
        
        <!-- ================= SIDEBAR (CHATS & FEED) ================= -->
        <div class="w-1/3 border-r border-gray-200 flex flex-col bg-white">
            
            <!-- Header do Perfil / Navegação -->
            <div class="p-4 bg-gray-50 flex items-center justify-between border-b">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-full bg-emerald-600 flex items-center text-white font-bold justify-center shadow">DM</div>
                    <div>
                        <h2 class="font-bold text-gray-800 text-sm">Dridalia Moda</h2>
                        <span class="text-[10px] text-emerald-600 font-semibold bg-emerald-50 px-2 py-0.5 rounded-full">R2 + Firebase Ready</span>
                    </div>
                </div>
                <div class="flex space-x-2 bg-gray-200 p-1 rounded-lg text-xs font-semibold">
                    <button @click="activeTab = 'chats'" :class="activeTab === 'chats' ? 'bg-white text-emerald-700 shadow-sm' : 'text-gray-600'" class="px-3 py-1 rounded-md transition">Chats</button>
                    <button @click="activeTab = 'feed'" :class="activeTab === 'feed' ? 'bg-white text-emerald-700 shadow-sm' : 'text-gray-600'" class="px-3 py-1 rounded-md transition">Feed</button>
                </div>
            </div>

            <!-- Barra de Pesquisa (Filtro local = 0 leituras extras no banco) -->
            <div class="p-3 bg-white border-b">
                <div class="flex items-center bg-gray-100 px-3 py-2 rounded-lg">
                    <i class="fa-solid fa-search text-gray-400 mr-2 text-sm"></i>
                    <input type="text" x-model="searchQuery" placeholder="Pesquisar conversas ou produtos..." class="bg-transparent w-full focus:outline-none text-sm text-gray-700">
                </div>
            </div>

            <!-- Conteúdo da Sidebar -->
            <div class="overflow-y-auto flex-1">
                <!-- ABA CHATS -->
                <template x-if="activeTab === 'chats'">
                    <div>
                        <template x-for="chat in filteredChats" :key="chat.id">
                            <div @click="selectChat(chat)" 
                                 :class="selectedChat.id === chat.id ? 'bg-emerald-50/50 border-r-4 border-emerald-600' : 'hover:bg-gray-50'"
                                 class="flex items-center p-3 cursor-pointer border-b border-gray-100 transition">
                                <img :src="chat.avatar" class="w-12 h-12 rounded-full object-cover mr-3 shadow-sm" loading="lazy">
                                <div class="flex-1 min-w-0">
                                    <div class="flex justify-between items-center mb-1">
                                        <h4 class="font-semibold text-gray-800 text-sm truncate" x-text="chat.name"></h4>
                                        <span class="text-[10px] text-gray-400" x-text="chat.time"></span>
                                    </div>
                                    <p class="text-xs text-gray-500 truncate" x-text="chat.lastMessage"></p>
                                </div>
                            </div>
                        </template>
                    </div>
                </template>

                <!-- ABA FEED SOCIAL -->
                <template x-if="activeTab === 'feed'">
                    <div class="p-3 space-y-4">
                        <template x-for="post in feedPosts" :key="post.id">
                            <div class="bg-white border border-gray-200 rounded-xl p-3 shadow-sm">
                                <div class="flex items-center justify-between mb-2">
                                    <div class="flex items-center space-x-2">
                                        <img :src="post.avatar" class="w-8 h-8 rounded-full object-cover" loading="lazy">
                                        <span class="font-bold text-xs text-gray-800" x-text="post.author"></span>
                                    </div>
                                    <button @click="post.following = !post.following" 
                                            :class="post.following ? 'bg-gray-100 text-gray-700' : 'bg-emerald-600 text-white'"
                                            class="text-[10px] px-3 py-1 rounded-full font-semibold transition"
                                            x-text="post.following ? 'Seguindo' : 'Seguir'">
                                    </button>
                                </div>
                                <img :src="post.image" class="rounded-lg w-full h-48 object-cover mb-2 shadow-sm" loading="lazy">
                                <p class="text-xs text-gray-700 leading-relaxed" x-text="post.caption"></p>
                            </div>
                        </template>
                    </div>
                </template>
            </div>
        </div>

        <!-- ================= JANELA PRINCIPAL DE CHAT ================= -->
        <div class="w-2/3 flex flex-col bg-gray-50">
            
            <!-- Header do Chat Ativo -->
            <div class="p-4 bg-white border-b flex items-center justify-between shadow-sm">
                <div class="flex items-center space-x-3">
                    <img :src="selectedChat.avatar" class="w-10 h-10 rounded-full object-cover shadow-sm">
                    <div>
                        <h3 class="font-bold text-gray-800 text-sm" x-text="selectedChat.name"></h3>
                        <span class="text-[10px] text-emerald-600 font-medium flex items-center">
                            <span class="w-2 h-2 rounded-full bg-emerald-500 inline-block mr-1"></span> 
                            <span x-text="selectedChat.status"></span>
                        </span>
                    </div>
                </div>
                <div class="flex items-center space-x-3">
                    <button @click="selectedChat.following = !selectedChat.following" 
                            :class="selectedChat.following ? 'bg-gray-100 text-gray-700' : 'bg-emerald-600 text-white'"
                            class="px-3 py-1.5 rounded-lg text-xs font-semibold shadow-sm transition flex items-center space-x-1">
                        <i :class="selectedChat.following ? 'fa-solid fa-check' : 'fa-solid fa-user-plus'"></i>
                        <span x-text="selectedChat.following ? 'Seguindo' : 'Seguir'"></span>
                    </button>
                    <button @click="showCatalog = !showCatalog" class="bg-emerald-50 text-emerald-700 p-2 rounded-lg hover:bg-emerald-100 transition shadow-sm" title="Abrir Vitrine / Catálogo R2">
                        <i class="fa-solid fa-store text-base"></i>
                    </button>
                </div>
            </div>

            <!-- Corpo das Mensagens -->
            <div class="flex-1 overflow-y-auto p-4 space-y-3" id="chatMessages">
                <template x-for="msg in selectedChat.messages" :key="msg.id">
                    <div :class="msg.sender === 'me' ? 'flex justify-end' : 'flex justify-start'">
                        <div :class="msg.sender === 'me' ? 'bg-emerald-600 text-white rounded-br-none' : 'bg-white text-gray-800 border border-gray-200 rounded-bl-none'"
                             class="max-w-md p-3 rounded-2xl shadow-sm relative text-xs">
                            
                            <!-- Imagem Enviada -->
                            <template x-if="msg.type === 'image'">
                                <img :src="msg.content" class="rounded-lg max-h-48 w-full object-cover mb-1 shadow-sm cursor-pointer" @click="openMediaViewer(msg.content, 'image')" loading="lazy">
                            </template>

                            <!-- Vídeo Enviado -->
                            <template x-if="msg.type === 'video'">
                                <video controls class="rounded-lg max-h-48 w-full object-cover mb-1 shadow-sm">
                                    <source :src="msg.content" type="video/mp4">
                                    Seu navegador não suporta vídeos.
                                </video>
                            </template>

                            <!-- Áudio Enviado -->
                            <template x-if="msg.type === 'audio'">
                                <div class="mb-1">
                                    <audio controls class="w-48 h-8">
                                        <source :src="msg.content" type="audio/mp3">
                                        Seu navegador não suporta áudio.
                                    </audio>
                                </div>
                            </template>
                            
                            <!-- Texto -->
                            <template x-if="msg.type === 'text'">
                                <p class="leading-relaxed" x-text="msg.content"></p>
                            </template>

                            <span class="block text-[9px] text-right mt-1 opacity-70" x-text="msg.time"></span>
                        </div>
                    </div>
                </template>
            </div>

            <!-- Drawer do Catálogo R2 Integrado -->
            <div x-show="showCatalog" class="bg-white border-t border-gray-200 p-4 transition-all shadow-lg" x-cloak>
                <div class="flex justify-between items-center mb-3">
                    <h4 class="font-bold text-gray-800 text-xs flex items-center">
                        <i class="fa-solid fa-tags text-emerald-600 mr-2"></i> Vitrine Dridalia Moda (Cloudflare R2)
                    </h4>
                    <button @click="showCatalog = false" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-sm"></i></button>
                </div>
                <div class="grid grid-cols-3 gap-3">
                    <template x-for="product in products" :key="product.id">
                        <div class="border border-gray-100 rounded-xl p-2 bg-gray-50 flex flex-col justify-between shadow-sm hover:shadow transition">
                            <img :src="product.image" class="h-28 w-full object-cover rounded-lg mb-2 shadow-sm" loading="lazy">
                            <span class="text-xs font-semibold text-gray-800 truncate" x-text="product.name"></span>
                            <span class="text-xs text-emerald-600 font-bold mb-2" x-text="product.price"></span>
                            <button @click="sendProduct(product)" class="bg-emerald-600 text-white text-[10px] py-1.5 rounded-lg hover:bg-emerald-700 transition font-medium">
                                Enviar no Chat
                            </button>
                        </div>
                    </template>
                </div>
            </div>

            <!-- Rodapé de Envio -->
            <div class="p-3 bg-white border-t border-gray-200 flex items-center space-x-2">
                <button @click="showCatalog = !showCatalog" class="text-gray-500 hover:text-emerald-600 p-2 transition" title="Abrir Catálogo"><i class="fa-solid fa-paperclip text-base"></i></button>
                
                <!-- Input para Imagem, Vídeo ou Áudio com Pré-visualização -->
                <label class="text-gray-500 hover:text-emerald-600 p-2 cursor-pointer transition" title="Enviar Mídia (Foto, Vídeo ou Áudio)">
                    <i class="fa-solid fa-photo-film text-base"></i>
                    <input type="file" accept="image/*,video/*,audio/*" class="hidden" @change="handleFileSelect($event)">
                </label>

                <input type="text" x-model="newMessageText" @keydown.enter="sendMessage()" placeholder="Digite sua mensagem..." class="flex-1 bg-gray-100 px-4 py-2 rounded-xl focus:outline-none text-xs text-gray-700">
                
                <button @click="sendMessage()" class="bg-emerald-600 text-white px-4 py-2 rounded-xl hover:bg-emerald-700 transition shadow-sm text-xs font-semibold">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>

        </div>

        <!-- ================= MODAL DE PRÉ-VISUALIZAÇÃO DE MÍDIA (COM BARRA VERDE E BOTÕES) ================= -->
        <div x-show="showPreviewModal" class="absolute inset-0 bg-black/70 z-50 flex items-center justify-center p-4 backdrop-blur-sm" x-cloak>
            <div class="bg-white rounded-2xl max-w-lg w-full p-5 shadow-2xl flex flex-col space-y-4">
                
                <div class="flex justify-between items-center border-b pb-3">
                    <h3 class="font-bold text-gray-800 text-sm flex items-center">
                        <i class="fa-solid fa-cloud-arrow-up text-emerald-600 mr-2"></i> Pré-visualizar Mídia antes de Enviar
                    </h3>
                    <button @click="cancelPreview()" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-lg"></i></button>
                </div>

                <!-- Barra de Progresso Verde (Simulando Upload/Processamento R2) -->
                <div class="w-full bg-gray-100 rounded-full h-2.5 overflow-hidden">
                    <div class="bg-emerald-500 h-2.5 rounded-full transition-all duration-500" :style="`width: ${uploadProgress}%`"></div>
                </div>
                <div class="flex justify-between text-[10px] text-gray-500 -mt-2">
                    <span x-text="uploadingStatusText"></span>
                    <span x-text="uploadProgress + '%'"></span>
                </div>

                <!-- Container do Conteúdo (Imagem, Vídeo ou Áudio) -->
                <div class="bg-gray-900 rounded-xl overflow-hidden flex items-center justify-center p-2 min-h-[220px] max-h-[320px] relative">
                    <!-- Preview Imagem -->
                    <template x-if="previewType === 'image'">
                        <img :src="previewUrl" class="max-h-[300px] object-contain rounded-lg">
                    </template>

                    <!-- Preview Vídeo -->
                    <template x-if="previewType === 'video'">
                        <video controls class="max-h-[300px] w-full rounded-lg">
                            <source :src="previewUrl" :type="previewMime">
                            Seu navegador não suporta visualização de vídeo.
                        </video>
                    </template>

                    <!-- Preview Áudio -->
                    <template x-if="previewType === 'audio'">
                        <div class="flex flex-col items-center space-y-3 w-full p-6">
                            <div class="w-16 h-16 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center text-2xl">
                                <i class="fa-solid fa-microphone-lines"></i>
                            </div>
                            <audio controls class="w-full">
                                <source :src="previewUrl" :type="previewMime">
                                Seu navegador não suporta áudio.
                            </audio>
                        </div>
                    </template>
                </div>

                <!-- Botões de Ação (Excluir/Cancelar ou Enviar) -->
                <div class="flex justify-end space-x-3 pt-2">
                    <button @click="cancelPreview()" class="px-4 py-2 rounded-xl border border-gray-300 text-gray-700 hover:bg-gray-100 text-xs font-semibold transition flex items-center space-x-1">
                        <i class="fa-solid fa-trash text-red-500 mr-1"></i> Excluir / Cancelar
                    </button>
                    <button @click="confirmSendMedia()" :disabled="uploadProgress < 100" :class="uploadProgress < 100 ? 'opacity-50 cursor-not-allowed bg-emerald-400' : 'bg-emerald-600 hover:bg-emerald-700'" class="px-5 py-2 rounded-xl text-white text-xs font-semibold transition flex items-center space-x-1 shadow">
                        <i class="fa-solid fa-paper-plane mr-1"></i> Enviar Mídia
                    </button>
                </div>

            </div>
        </div>

    </div>

    <!-- Script de Gerenciamento da Aplicação -->
    <script>
        function app() {
            return {
                activeTab: 'chats',
                showCatalog: false,
                newMessageText: '',
                searchQuery: '',
                
                // Estados da Pré-visualização de Mídia
                showPreviewModal: false,
                previewUrl: '',
                previewType: 'image', // 'image', 'video', 'audio'
                previewMime: '',
                uploadProgress: 0,
                uploadingStatusText: 'Processando arquivo...',
                selectedFileToUpload: null,

                selectedChat: {
                    id: 1,
                    name: 'Conjunto Drii Oficial - Suporte',
                    avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150',
                    status: 'Online • Loja Verificada',
                    following: true,
                    messages: [
                        { id: 1, sender: 'other', type: 'text', content: 'Olá! Envie fotos, vídeos ou áudios para testar a pré-visualização com barra verde.', time: '09:00' }
                    ]
                },
                chats: [
                    {
                        id: 1,
                        name: 'Conjunto Drii Oficial - Suporte',
                        avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150',
                        lastMessage: 'Olá! Envie fotos, vídeos ou áudios...',
                        time: '09:00',
                        status: 'Online',
                        following: true,
                        messages: [
                            { id: 1, sender: 'other', type: 'text', content: 'Olá! Envie fotos, vídeos ou áudios para testar a pré-visualização com barra verde.', time: '09:00' }
                        ]
                    }
                ],
                products: [
                    { id: 1, name: 'Conjunto Drii Moletinho', price: 'R$ 189,90', image: 'https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?w=300' },
                    { id: 2, name: 'Vestido Midi Casual', price: 'R$ 149,90', image: 'https://images.unsplash.com/photo-1539109136881-3be0616acf4b?w=300' },
                    { id: 3, name: 'Blazer Alfaiataria', price: 'R$ 229,90', image: 'https://images.unsplash.com/photo-1490481651871-ab68de25d43d?w=300' }
                ],
                feedPosts: [
                    { id: 1, author: 'Dridalia Moda Feminina', avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150', image: 'https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?w=600', caption: 'Conjunto Drii de moletinho disponível em novas cores!', following: true }
                ],
                get filteredChats() {
                    if (!this.searchQuery) return this.chats;
                    const q = this.searchQuery.toLowerCase();
                    return this.chats.filter(c => c.name.toLowerCase().includes(q) || c.lastMessage.toLowerCase().includes(q));
                },
                selectChat(chat) {
                    this.selectedChat = chat;
                },
                sendMessage() {
                    if(!this.newMessageText.trim()) return;
                    const timeNow = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    this.selectedChat.messages.push({
                        id: Date.now(),
                        sender: 'me',
                        type: 'text',
                        content: this.newMessageText,
                        time: timeNow
                    });
                    this.selectedChat.lastMessage = this.newMessageText;
                    this.newMessageText = '';
                },
                sendProduct(product) {
                    const timeNow = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    this.selectedChat.messages.push({
                        id: Date.now(),
                        sender: 'me',
                        type: 'text',
                        content: `📦 [Produto Sugerido]: ${product.name} - ${product.price}`,
                        time: timeNow
                    });
                    this.selectedChat.lastMessage = `Compartilhou: ${product.name}`;
                    this.showCatalog = false;
                },
                
                // Disparado ao selecionar o arquivo
                handleFileSelect(event) {
                    const file = event.target.files[0];
                    if (!file) return;

                    this.selectedFileToUpload = file;
                    this.previewMime = file.type;
                    this.previewUrl = URL.createObjectURL(file);

                    if (file.type.startsWith('image/')) {
                        this.previewType = 'image';
                    } else if (file.type.startsWith('video/')) {
                        this.previewType = 'video';
                    } else if (file.type.startsWith('audio/')) {
                        this.previewType = 'audio';
                    } else {
                        alert('Formato não suportado.');
                        return;
                    }

                    // Abre o modal de preview e simula a barra de progresso verde
                    this.showPreviewModal = true;
                    this.uploadProgress = 10;
                    this.uploadingStatusText = 'Carregando arquivo...';

                    let interval = setInterval(() => {
                        if (this.uploadProgress < 100) {
                            this.uploadProgress += 30;
                            if (this.uploadProgress >= 100) {
                                this.uploadProgress = 100;
                                this.uploadingStatusText = 'Pronto para enviar!';
                                clearInterval(interval);
                            }
                        }
                    }, 400);
                    
                    event.target.value = ''; // Limpa input
                },

                cancelPreview() {
                    this.showPreviewModal = false;
                    this.previewUrl = '';
                    this.selectedFileToUpload = null;
                    this.uploadProgress = 0;
                },

                confirmSendMedia() {
                    if (this.uploadProgress < 100) return;
                    const timeNow = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    
                    this.selectedChat.messages.push({
                        id: Date.now(),
                        sender: 'me',
                        type: this.previewType,
                        content: this.previewUrl,
                        time: timeNow
                    });

                    this.selectedChat.lastMessage = `[${this.previewType.toUpperCase()} enviado]`;
                    this.cancelPreview();
                }
            }
        }
    </script>
</body>
</html>
