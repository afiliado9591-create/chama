<!doctype html>

<head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><meta name="theme-color" content="#0b7a53"/><link rel="manifest" href="./manifest.webmanifest"/><link rel="icon" href="./icon.svg"/><title>Chama</title><style>
:root{--green:#0b7a53;--bg:#f3f5f4;--line:#e6e9e7;--text:#14221c;--muted:#6a756f}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}button,input{font:inherit}.hidden{display:none!important}.shell{min-height:100dvh;max-width:900px;margin:auto;background:#fff}.auth{min-height:100dvh;display:grid;place-items:center;padding:24px;background:linear-gradient(160deg,#e9fff6,#f7faf8)}.auth-card{width:min(430px,100%);background:#fff;padding:28px;border-radius:24px;box-shadow:0 18px 60px #0b7a5322}.brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}.logo{width:52px;height:52px;border-radius:17px;background:var(--green);color:#fff;display:grid;place-items:center;font-size:28px;font-weight:800}h1{margin:0;font-size:30px}.sub{color:var(--muted);margin:4px 0 22px}.field{display:grid;gap:7px;margin:13px 0}.field label{font-size:14px;font-weight:650}.field input{border:1px solid #ccd4d0;border-radius:14px;padding:14px 15px;outline:none}.field input:focus{border-color:var(--green)}.primary{width:100%;border:0;background:var(--green);color:#fff;padding:14px 16px;border-radius:14px;font-weight:750;cursor:pointer}.secondary{width:100%;border:1px solid #c9d4cf;background:#fff;color:var(--green);padding:13px 16px;border-radius:14px;font-weight:700;cursor:pointer;margin-top:9px}.msg{min-height:22px;margin-top:10px;font-size:14px;color:#b42318}.topbar{height:66px;background:var(--green);color:#fff;display:flex;align-items:center;padding:0 16px;gap:12px;position:sticky;top:0;z-index:5}.topbar h2{margin:0;font-size:21px;flex:1}.iconbtn{border:0;background:#ffffff18;color:#fff;border-radius:12px;padding:10px 12px;cursor:pointer}.layout{display:grid;grid-template-columns:330px 1fr;min-height:calc(100dvh - 66px)}.sidebar{border-right:1px solid var(--line);background:#fff}.me{padding:16px;border-bottom:1px solid var(--line)}.me small{color:var(--muted)}.section-title{font-size:13px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.06em;padding:14px 16px 8px}.user{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid #f0f2f1;cursor:pointer}.user:hover{background:#f6faf8}.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#dff4ea;color:var(--green);font-weight:800}.user-main{min-width:0;flex:1}.user-name{font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.user-email{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chat{display:flex;flex-direction:column;background:#eef2ef;min-width:0}.empty{margin:auto;text-align:center;color:var(--muted);padding:30px}.chat-head{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 14px}.chat-head strong{display:block}.chat-head small{color:var(--muted)}.messages{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:8px}.bubble{max-width:min(78%,520px);padding:10px 12px;border-radius:16px;box-shadow:0 1px 1px #0000000b;word-break:break-word}.mine{align-self:flex-end;background:#d7f7e7;border-bottom-right-radius:5px}.theirs{align-self:flex-start;background:#fff;border-bottom-left-radius:5px}.time{display:block;text-align:right;font-size:10px;color:#6d7772;margin-top:4px}.composer{display:flex;gap:8px;padding:10px;background:#fff;border-top:1px solid var(--line);padding-bottom:max(10px,env(safe-area-inset-bottom));align-items:center}.composer input{flex:1;border:1px solid #d5ddd9;border-radius:999px;padding:12px 16px;outline:none;min-width:0}.send{border:0;background:var(--green);color:#fff;width:46px;height:46px;border-radius:50%;font-size:20px;flex:0 0 46px}.audio-record{border:0;background:#eef4f1;color:var(--green);width:42px;height:42px;border-radius:50%;font-size:20px;flex:0 0 42px;cursor:pointer}.audio-record.recording{background:#ffe5e5;color:#b42318}.install{background:#fff;color:var(--green);border:1px solid #ffffff80}.back{display:none}
/* GRUPOS / CATEGORIAS */
.groups-bar{display:flex;flex-wrap:wrap;gap:8px;padding:8px 16px 4px}
.group-chip{background:#eef4f1;color:#0b7a53;border:1px solid #d5e6de;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.group-chip.active{background:#0b7a53;color:#fff;border-color:#0b7a53}
.group-chip .del{cursor:pointer;opacity:.65;font-weight:900;line-height:1}
.group-chip .del:hover{opacity:1}
.admin-group-form{display:flex;gap:8px;padding:4px 16px 14px}
.admin-group-form input{flex:1;border:1px solid #ccd4d0;border-radius:10px;padding:8px 10px;font-size:13px;outline:none}
.admin-group-form input:focus{border-color:var(--green)}
.admin-group-form button{padding:8px 14px;font-size:13px;border-radius:10px;border:0;background:var(--green);color:#fff;font-weight:700;cursor:pointer;flex:0 0 auto}
.user-group-select{margin-left:8px;font-size:11px;border:1px solid #d5ddd9;border-radius:8px;padding:4px 6px;background:#fff;color:#333;flex:0 0 auto;max-width:110px}
@media(max-width:700px){.layout{grid-template-columns:1fr}.sidebar{border-right:0}.chat{position:fixed;inset:66px 0 0 0;z-index:4}.chat.hidden-mobile{display:none}.back{display:inline-block!important}}
</style></head><body>
<div id="authView" class="auth"><div class="auth-card"><div class="brand"><div class="logo">C</div><div><h1>Chama</h1><div class="sub">Converse em tempo real.</div></div></div><div class="field"><label>Nome</label><input id="name" placeholder="Seu nome" autocomplete="name"></div><div class="field"><label>E-mail</label><input id="email" type="email" placeholder="voce@email.com" autocomplete="email"></div><div class="field"><label>Senha</label><input id="password" type="password" placeholder="Mínimo 6 caracteres" autocomplete="current-password"></div><button id="loginBtn" class="primary">Entrar</button><button id="signupBtn" class="secondary">Criar minha conta</button><div id="authMsg" class="msg"></div></div></div>
<div id="appView" class="shell hidden"><header class="topbar"><h2>Chama</h2><button id="installBtn" class="iconbtn install hidden">Instalar Chama</button><button id="logoutBtn" class="iconbtn">Sair</button></header><main class="layout"><aside class="sidebar"><div class="me"><strong id="meName">Você</strong><br><small id="meEmail"></small></div><div class="section-title">Grupos</div><div id="groupsBar" class="groups-bar"></div><div id="adminGroupForm" class="admin-group-form hidden"><input id="newGroupName" placeholder="Nova categoria (ex: Moda Feminina)"><button id="addGroupBtn" type="button">Adicionar</button></div><div class="section-title">Pessoas</div><div id="usersList"></div></aside><section id="chatPanel" class="chat hidden-mobile"><div id="emptyState" class="empty"><h3>Escolha uma pessoa</h3><p>Toque em um contato para começar a conversar.</p></div><div id="activeChat" class="hidden" style="display:flex;flex-direction:column;min-height:calc(100dvh - 66px)"><div class="chat-head"><button id="backBtn" class="iconbtn back" style="background:#eef4f1;color:#0b7a53">←</button><div class="avatar" id="chatAvatar">C</div><div><strong id="chatName"></strong><small id="chatEmail"></small></div></div><div id="messages" class="messages"></div><form id="composer" class="composer"><button id="audioBtn" class="audio-record" type="button" title="Gravar áudio">🎤</button><input id="messageInput" maxlength="1500" placeholder="Digite uma mensagem..." autocomplete="off"><button class="send" type="submit">➤</button></form></div></section></main></div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";import{getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,updateProfile}from"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";import{getFirestore,doc,setDoc,getDoc,getDocs,deleteDoc,collection,query,onSnapshot,serverTimestamp,addDoc,orderBy,limit,increment}from"https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyCcAVkmLUKPcEMZ5erDswbOQ8eO493pl2I",authDomain:"chama-cfc28.firebaseapp.com",projectId:"chama-cfc28",storageBucket:"chama-cfc28.firebasestorage.app",messagingSenderId:"680045231088",appId:"1:680045231088:web:8db35684e4b56a320ebb35"};const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),MEDIA_PREFIX="__CHAMA_MEDIA__";const ADMIN_EMAIL="jeanaguiar636@gmail.com";const $=id=>document.getElementById(id);const authView=$("authView"),appView=$("appView"),authMsg=$("authMsg");let me=null,activeUser=null,stopMessages=null,usersLoadToken=0,installPrompt=null;let recorder=null,audioChunks=[],audioStream=null;
let usersCache=[],groupsCache=[],activeGroupFilter="Todos",stopGroups=null;
function isAdmin(){return!!me&&me.email===ADMIN_EMAIL}
function friendlyError(e){const c=e?.code||"";if(c.includes("invalid-credential"))return"E-mail ou senha incorretos.";if(c.includes("api-key-not-valid"))return"Erro de configuração do Firebase. Atualizando o aplicativo...";if(c.includes("email-already-in-use"))return"Este e-mail já está cadastrado.";if(c.includes("weak-password"))return"Use uma senha com pelo menos 6 caracteres.";if(c.includes("invalid-email"))return"Digite um e-mail válido.";return e?.message||"Não foi possível concluir."}
async function ensureProfile(user,requestedName=""){const ref=doc(db,"users",user.uid),snap=await getDoc(ref),fallback=(requestedName||user.displayName||user.email?.split("@")[0]||"Usuário").trim();if(!snap.exists())await setDoc(ref,{uid:user.uid,nome:fallback,email:user.email||"",createdAt:serverTimestamp(),updatedAt:serverTimestamp()});else if(!snap.data().uid||!snap.data().email)await setDoc(ref,{uid:user.uid,nome:snap.data().nome||fallback,email:user.email||"",updatedAt:serverTimestamp()},{merge:true})}
$("signupBtn").onclick=async()=>{authMsg.textContent="";try{const nome=$("name").value.trim();if(!nome)throw new Error("Digite seu nome.");const email=$("email").value.trim();if(!email)throw new Error("Digite um e-mail válido.");const cred=await createUserWithEmailAndPassword(auth,email,$("password").value);await updateProfile(cred.user,{displayName:nome});await ensureProfile(cred.user,nome)}catch(e){authMsg.textContent=friendlyError(e)}};
$("loginBtn").onclick=async()=>{authMsg.textContent="";try{const cred=await signInWithEmailAndPassword(auth,$("email").value.trim(),$("password").value);await ensureProfile(cred.user,$("name").value.trim())}catch(e){authMsg.textContent=friendlyError(e)}};$("logoutBtn").onclick=()=>signOut(auth);$("backBtn").onclick=()=>$("chatPanel").classList.add("hidden-mobile");
onAuthStateChanged(auth,async user=>{if(!user){me=null;activeUser=null;if(stopMessages){stopMessages();stopMessages=null}if(stopGroups){stopGroups();stopGroups=null}authView.classList.remove("hidden");appView.classList.add("hidden");return}me=user;try{await ensureProfile(user)}catch(e){console.error(e)}$("meName").textContent=user.displayName||user.email?.split("@")[0]||"Você";$("meEmail").textContent=user.email||"";authView.classList.add("hidden");appView.classList.remove("hidden");listenGroups();listenUsers();});
function listenGroups(){if(stopGroups)stopGroups();stopGroups=onSnapshot(query(collection(db,"groups"),orderBy("name","asc")),snap=>{groupsCache=snap.docs.map(d=>({id:d.id,...d.data()}));renderGroupsBar();renderUsersList()},e=>console.error(e))}
function renderGroupsBar(){const bar=$("groupsBar");if(!bar)return;const names=["Todos",...groupsCache.map(g=>g.name)];if(!names.includes(activeGroupFilter))activeGroupFilter="Todos";bar.innerHTML=names.map(name=>{const g=groupsCache.find(x=>x.name===name);const del=(isAdmin()&&g)?'<span class="del" data-del="'+g.id+'">×</span>':"";return'<span class="group-chip '+(name===activeGroupFilter?"active":"")+'" data-filter="'+escapeHtml(name)+'">'+escapeHtml(name)+del+"</span>"}).join("");bar.querySelectorAll("[data-filter]").forEach(el=>{el.addEventListener("click",e=>{if(e.target.closest(".del"))return;activeGroupFilter=el.dataset.filter;renderGroupsBar();renderUsersList()})});bar.querySelectorAll("[data-del]").forEach(el=>{el.addEventListener("click",async e=>{e.stopPropagation();if(!confirm("Excluir esta categoria?"))return;try{await deleteDoc(doc(db,"groups",el.dataset.del))}catch(err){console.error(err);alert("Não foi possível excluir a categoria.")}})});$("adminGroupForm")?.classList.toggle("hidden",!isAdmin())}
$("addGroupBtn").onclick=async()=>{const input=$("newGroupName"),name=(input?.value||"").trim();if(!name)return;if(groupsCache.some(g=>g.name.toLowerCase()===name.toLowerCase())){alert("Essa categoria já existe!");return}try{await addDoc(collection(db,"groups"),{name,createdAt:serverTimestamp(),createdBy:me?.uid||""});if(input)input.value=""}catch(e){console.error(e);alert("Não foi possível criar a categoria.")}};
async function listenUsers(){const token=++usersLoadToken,list=$("usersList");if(!list)return;list.innerHTML='<div style="padding:16px;color:#6a756f">Carregando pessoas...</div>';try{const snap=await getDocs(query(collection(db,"users"),limit(50)));if(token!==usersLoadToken)return;usersCache=snap.docs.map(d=>({id:d.id,...d.data()})).filter(u=>u.id!==me?.uid);renderUsersList()}catch(e){console.error(e);list.innerHTML='<div style="padding:16px;color:#b42318">Não foi possível carregar as pessoas.</div>'}}
function renderUsersList(){const list=$("usersList");if(!list)return;const arr=activeGroupFilter==="Todos"?usersCache:usersCache.filter(u=>u.grupo===activeGroupFilter);if(!arr.length){list.innerHTML='<div style="padding:16px;color:#6a756f">Nenhuma pessoa nesta categoria.</div>';return}list.innerHTML="";for(const u of arr){const row=document.createElement("div");row.className="user";row.innerHTML='<div class="avatar">'+String(u.nome||"U").slice(0,1).toUpperCase()+'</div><div class="user-main"><div class="user-name">'+escapeHtml(u.nome||"Usuário")+'</div><div class="user-email">'+escapeHtml(u.email||"")+(u.grupo?" · 🏷️ "+escapeHtml(u.grupo):"")+"</div></div>";row.onclick=()=>openChat(u);if(isAdmin()){const sel=document.createElement("select");sel.className="user-group-select";sel.innerHTML='<option value="">Sem categoria</option>'+groupsCache.map(g=>'<option value="'+escapeHtml(g.name)+'" '+(u.grupo===g.name?"selected":"")+">"+escapeHtml(g.name)+"</option>").join("");sel.onclick=e=>e.stopPropagation();sel.onchange=async e=>{e.stopPropagation();try{await setDoc(doc(db,"users",u.id),{grupo:sel.value},{merge:true});u.grupo=sel.value;renderUsersList()}catch(err){console.error(err);alert("Não foi possível salvar a categoria.")}};row.appendChild(sel)}list.appendChild(row)}}
function escapeHtml(v){return String(v??"").replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function chatId(a,b){return[a,b].sort().join("_")}
function openChat(u){activeUser=u;$("emptyState").classList.add("hidden");$("activeChat").classList.remove("hidden");$("chatName").textContent=u.nome||"Usuário";$("chatEmail").textContent=u.email||"";$("chatAvatar").textContent=String(u.nome||"U").slice(0,1).toUpperCase();$("chatPanel").classList.remove("hidden-mobile");if(stopMessages)stopMessages();const ref=collection(db,"chats",chatId(me.uid,u.id),"messages");stopMessages=onSnapshot(query(ref,orderBy("createdAt","asc"),limit(200)),snap=>{const box=$("messages");box.innerHTML="";snap.forEach(d=>{const m=d.data(),b=document.createElement("div");b.className="bubble "+(m.from===me.uid?"mine":"theirs");b.textContent=String(m.text||"").startsWith(MEDIA_PREFIX)?"Mídia":(m.text||"");const t=document.createElement("span");t.className="time";t.textContent=m.createdAt?.toDate?m.createdAt.toDate().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}):"";b.appendChild(t);box.appendChild(b)});box.scrollTop=box.scrollHeight},e=>console.error(e))}
$("composer").onsubmit=async e=>{e.preventDefault();if(!me||!activeUser)return;const text=$("messageInput").value.trim();if(!text)return;try{await addDoc(collection(db,"chats",chatId(me.uid,activeUser.id),"messages"),{from:me.uid,to:activeUser.id,text,createdAt:serverTimestamp()});await setDoc(doc(db,"chats",chatId(me.uid,activeUser.id)),{participants:[me.uid,activeUser.id],lastMessage:text,updatedAt:serverTimestamp(),['unread_'+activeUser.id]:increment(1)},{merge:true});$("messageInput").value=""}catch(err){console.error(err)}};
$("audioBtn").onclick=async()=>{try{if(recorder?.state==="recording"){recorder.stop();return}if(!navigator.mediaDevices?.getUserMedia)throw new Error("Seu navegador não permite gravação de áudio.");audioStream=await navigator.mediaDevices.getUserMedia({audio:true});audioChunks=[];recorder=new MediaRecorder(audioStream);recorder.ondataavailable=e=>{if(e.data.size)audioChunks.push(e.data)};recorder.onstop=()=>{audioStream?.getTracks().forEach(t=>t.stop());$("audioBtn").classList.remove("recording");showAudioPreview(new Blob(audioChunks,{type:recorder.mimeType||"audio/webm"}))};recorder.start();$("audioBtn").classList.add("recording")}catch(e){console.error(e);alert(e.message||"Não foi possível gravar áudio.")}};
function showAudioPreview(blob){const url=URL.createObjectURL(blob),back=document.createElement("div");back.className="audio-preview-backdrop";back.innerHTML='<div class="audio-preview-card"><strong>Ouvir áudio antes de enviar</strong><audio controls></audio><div class="audio-preview-actions"><button type="button" class="audio-preview-delete">Excluir</button><button type="button" class="audio-preview-send">Enviar</button></div></div>';back.querySelector("audio").src=url;back.querySelector(".audio-preview-delete").onclick=()=>{URL.revokeObjectURL(url);back.remove()};back.querySelector(".audio-preview-send").onclick=async()=>{const btn=back.querySelector(".audio-preview-send");btn.disabled=true;btn.textContent="Enviando...";try{const fd=new FormData();fd.append("file",blob,"audio.webm");const r=await fetch("/api/media",{method:"POST",body:fd});if(!r.ok)throw new Error("Falha no upload");const j=await r.json();await addDoc(collection(db,"chats",chatId(me.uid,activeUser.id),"messages"),{from:me.uid,to:activeUser.id,text:MEDIA_PREFIX+JSON.stringify({type:"audio",url:j.url,key:j.key||""}),createdAt:serverTimestamp()});URL.revokeObjectURL(url);back.remove()}catch(e){console.error(e);btn.disabled=false;btn.textContent="Enviar";alert("Não foi possível enviar o áudio.")}};document.body.appendChild(back)}
window.chamaOpenChat=openChat;window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();installPrompt=e;$("installBtn")?.classList.remove("hidden")});$("installBtn").onclick=async()=>{if(!installPrompt)return;installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;$("installBtn")?.classList.add("hidden")};if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js?v=197").catch(console.error));
</script><script src="./forgot-password.js?v=3" defer></script></body></html>
