<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chama - Aplicativo de Conversa</title>
    <!-- Importa o arquivo de estilos -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Container Principal -->
    <div class="app-container" id="appContainer">
        
        <!-- Barra Lateral (Busca e Pesquisa) -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>Chama</h2>
            </div>
            <div class="search-box">
                <input type="text" placeholder="Pesquisar conversas..." />
            </div>
            <!-- Lista de conversas ou menus aqui -->
        </aside>

        <!-- Botão da Seta para Recolher/Expandir a Lateral -->
        <button id="sidebarToggle" class="sidebar-toggle-btn" title="Alternar menu">
            ◀
        </button>

        <!-- Área Principal do Chat -->
        <main class="chat-area">
            <div id="messages" class="messages-container">
                <!-- As mensagens do chat vão aparecer aqui -->
            </div>
        </main>
        
    </div>

    <!-- Importa o arquivo de lógica e vídeos -->
    <script src="script.js"></script>
</body>
</html>
