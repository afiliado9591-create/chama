function money(v=""){let s=String(v).trim();return s?(/^R\$/i.test(s)?s:"R$ "+s):""}function showCatalog(u,mine=false){currentCatalogUser=u;$("catalogTitle").textContent=`Catálogo de ${u.nome||"Usuário"}`;let items=Array.isArray(u.catalogo)?u.catalogo:[];$("catalogNote").textContent=items.length?`${items.length} produto${items.length>1?"s":""} • Mercado Livre e Shopee`:"Este usuário ainda não cadastrou produtos.";let g=$("catalogGrid");g.innerHTML="";items.forEach(p=>{let link=cleanUrl(p.link||""),img=cleanUrl(p.imagem||"");let c=document.createElement("div");c.className="product";c.innerHTML=`<div class="product-img">${img?`<img src="${esc(img)}" loading="lazy" alt="${esc(p.titulo||"Produto")}">`:"Sem imagem"}</div><div class="product-body"><span class="badge">${esc(p.plataforma||"Produto")}</span><div class="product-title">${esc(p.titulo||"Produto")}</div><div class="product-price">${esc(money(p.preco))}</div>${link?`<a class="buy" href="${esc(link)}" target="_blank" rel="noopener sponsored">Ver produto</a>`:""}</div>`;g.appendChild(c)});let a=$("catalogOwnerActions");a.innerHTML="";if(mine){let b=document.createElement("button");b.className="secondary";b.textContent="Editar meu catálogo";b.onclick=openCatalogEdit;a.appendChild(b)}$("catalogView").classList.remove("hidden");$("catalogEdit").classList.add("hidden");$("catalogModal").classList.remove("hidden")}
function productEditor(p={}){let d=document.createElement("div");d.className="product-edit";d.innerHTML=`<div class="product-edit-head"><strong>Produto</strong><button class="remove" type="button">Remover</button></div><div class="two"><div class="field"><label>Plataforma</label><select class="p-platform"><option${p.plataforma==="Mercado Livre"?" selected":""}>Mercado Livre</option><option${p.plataforma==="Shopee"?" selected":""}>Shopee</option></select></div><div class="field"><label>Preço</label><input class="p-price" value="${esc(p.preco||"")}" placeholder="99,90"></div></div><div class="field"><label>Título</label><input class="p-title" maxlength="160" value="${esc(p.titulo||"")}" placeholder="Nome do produto"></div><div class="field"><label>Link de afiliado</label><input class="p-link" value="${esc(p.link||"")}" placeholder="Cole seu link do Mercado Livre ou Shopee"></div><div class="field"><label>Link da imagem</label><input class="p-image" value="${esc(p.imagem||"")}" placeholder="https://...jpg"></div>`;d.querySelector(".remove").onclick=()=>d.remove();return d}function openCatalogEdit(){let ed=$("catalogEditor");ed.innerHTML="";(myProfile.catalogo||[]).forEach(p=>ed.appendChild(productEditor(p)));$("catalogView").classList.add("hidden");$("catalogEdit").classList.remove("hidden")}$("addProduct").onclick=()=>{let e=$("catalogEditor");if(e.children.length>=30)return alert("O limite é de 30 produtos.");e.appendChild(productEditor())};$("cancelCatalogEdit").onclick=()=>showCatalog(myProfile,true);$("closeCatalog").onclick=()=>$("catalogModal").classList.add("hidden");$("chatCatalogBtn").onclick=()=>activeUser&&showCatalog(activeUser,false);
$("saveCatalog").onclick=async()=>{let rows=[...$("catalogEditor").children];if(rows.length>30)return;let catalogo=[];for(let r of rows){let plataforma=r.querySelector(".p-platform").value,titulo=r.querySelector(".p-title").value.trim(),preco=r.querySelector(".p-price").value.trim(),link=r.querySelector(".p-link").value.trim(),imagem=r.querySelector(".p-image").value.trim();if(!titulo&&!link&&!imagem)continue;if(!titulo||!link){$("catalogSaveMsg").textContent="Preencha título e link de afiliado em todos os produtos.";return}let url=cleanUrl(link);if(!url){$("catalogSaveMsg").textContent="Há um link de produto inválido.";return}catalogo.push({plataforma,titulo,preco,link:url,imagem:cleanUrl(imagem)})}try{$("saveCatalog").textContent="Salvando...";await setDoc(doc(db,"users",me.uid),{catalogo,updatedAt:serverTimestamp()},{merge:true});myProfile={...(myProfile||{}),catalogo};showCatalog(myProfile,true)}catch(e){console.error(e);$("catalogSaveMsg").textContent="Não foi possível salvar o catálogo."}finally{$("saveCatalog").textContent="Salvar catálogo"}};
async function openChat(u){activeUser=u;$("chatName").textContent=u.nome||"Usuário";$("chatEmail").textContent=u.email||"";setAvatar($("chatAvatar"),u);$("emptyState").classList.add("hidden");$("activeChat").classList.remove("hidden");$("chatPanel").classList.remove("hidden-mobile");let ids=[me.uid,u.uid].sort(),chatId=ids.join("_");await setDoc(doc(db,"chats",chatId),{participants:ids,updatedAt:serverTimestamp()},{merge:true});if(stopMessages)stopMessages();stopMessages=onSnapshot(query(collection(db,"chats",chatId,"messages"),orderBy("createdAt","asc"),limit(300)),s=>{let b=$("messages");b.innerHTML="";s.forEach(d=>{let m=d.data(),x=document.createElement("div");x.className="bubble "+(m.senderId===me.uid?"mine":"theirs");let t=m.createdAt?.toDate?m.createdAt.toDate().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}):"";x.innerHTML=`${esc(m.text||"")}<span class="time">${t}</span>`;b.appendChild(x)});b.scrollTop=b.scrollHeight})}
$("composer").onsubmit=async e=>{e.preventDefault();let text=$("messageInput").value.trim();if(!text||!activeUser)return;$("messageInput").value="";let ids=[me.uid,activeUser.uid].sort(),id=ids.join("_");await addDoc(collection(db,"chats",id,"messages"),{text,senderId:me.uid,receiverId:activeUser.uid,createdAt:serverTimestamp()});await setDoc(doc(db,"chats",id),{participants:ids,lastMessage:text,updatedAt:serverTimestamp()},{merge:true})};
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();installPrompt=e;$("installBtn").classList.remove("hidden")});$("installBtn").onclick=async()=>{if(installPrompt){installPrompt.prompt();await installPrompt.userChoice;installPrompt=null}};if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(console.error));
</script></body></html>
